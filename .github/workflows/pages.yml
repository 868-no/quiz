# Tests the tools and the site, builds the public site from approved content and
# deploys it to GitHub Pages (https://quiz.868.no/).
#
# CI has no access to the private source import, so it publishes with
# --without-source: only revisions whose approval pins their exact content are
# built (the textbook copy checks ran locally when they were verified and
# approved). The release check then scans the build (file types, private
# markers, allowlisted bank fields, offline copy) and nothing is deployed if any
# step fails. Only the built dist/ folder is published.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["content/**", "web/**", "config/**", "tools/**", "tests/**", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install test tools (jsdom, Playwright, axe-core; locked versions, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for the accessibility check
        run: npx playwright install --with-deps chromium
      - name: Build the site for the accessibility check
        run: python3 -m tools publish --without-source
      - name: Tool and site tests, accessibility check, figure layout check
        run: ./run-tests.sh
        env:
          RADIOQUIZ_REQUIRE_JSDOM: "1"     # fail instead of skipping the UI tests
          RADIOQUIZ_REQUIRE_BROWSER: "1"   # ... or the browser checks

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build from approved content (fails closed)
        run: python3 -m tools publish --without-source
      - name: Release check (fails closed)
        run: python3 -m tools release-check dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
