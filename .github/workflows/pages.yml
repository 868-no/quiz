# Builds the public site from approved content and deploys it to GitHub Pages
# (https://quiz.868.no/).
#
# CI has no access to the private source import, so it publishes with
# --without-source: only revisions whose approval pins their exact content are
# built (the textbook copy checks ran locally when they were verified and
# approved). The release check then scans the build (file types, private
# markers, allowlisted bank fields, offline copy) and nothing is deployed if any
# step fails. Only the built dist/ folder is published.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["content/**", "web/**", "config/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool tests
        run: python3 -m unittest discover -s tests/python -t .
      - name: Build from approved content (fails closed)
        run: python3 -m tools publish --without-source
      - name: Release check (fails closed)
        run: python3 -m tools release-check dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
